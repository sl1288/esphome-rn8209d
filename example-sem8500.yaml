# ============================= METERING ===========================
sensor:
  # ---- chip on CS=P9: channel A = outlet 3, channel B = outlet 4 ----
  - platform: rn8209d
    cs_pin: P9
    update_interval: 1s
    voltage_factor: 0.0001002004 # 1 / (10 * 998)
    current_a_factor: 0.0000075758 # 1 / (1000 * 132)
    current_b_factor: 0.0000285714 # 1 / (1000 * 35)
    power_a_factor: 0.0000248740 # 32768 * voltage_factor * current_a_factor
    power_b_factor: 0.0000938105
    voltage:
      name: "Voltage"
      filters:
        - throttle_average: 15s
    frequency:
      name: "Frequency"
      filters:
        - throttle_average: 15s
    # With the relay open no current flows and the raw values show only noise.
    # The lambda pins them to zero so neither the reading nor the energy counter
    # drifts. Note this is a gate on the relay state, not a current offset.
    # These sensors are internal; the display sensors further down are what
    # Home Assistant sees.
    current_a:
      id: current3
      internal: true
      filters:
        - lambda: "return id(outlet3).state ? x : 0.0f;"
    current_b:
      id: current4
      internal: true
      filters:
        - lambda: "return id(outlet4).state ? x : 0.0f;"
    power_a:
      id: power3
      internal: true
      filters:
        - lambda: "return id(outlet3).state ? x : 0.0f;"
    power_b:
      id: power4
      internal: true
      filters:
        - lambda: "return id(outlet4).state ? x : 0.0f;"

  # ---- chip on CS=P15: channel A = outlet 5, channel B = outlet 6 ----
  - platform: rn8209d
    cs_pin: P15
    update_interval: 1s
    voltage_factor: 0.0001001001 # 1 / (10 * 999)
    current_a_factor: 0.0000075758
    current_b_factor: 0.0000285714
    power_a_factor: 0.0000248491
    power_b_factor: 0.0000937166
    current_a:
      id: current5
      internal: true
      filters:
        - lambda: "return id(outlet5).state ? x : 0.0f;"
    current_b:
      id: current6
      internal: true
      filters:
        - lambda: "return id(outlet6).state ? x : 0.0f;"
    power_a:
      id: power5
      internal: true
      filters:
        - lambda: "return id(outlet5).state ? x : 0.0f;"
    power_b:
      id: power6
      internal: true
      filters:
        - lambda: "return id(outlet6).state ? x : 0.0f;"

  # ---- chip on CS=P20: channel A = outlet 1, channel B = outlet 2 ----
  - platform: rn8209d
    cs_pin: P20
    update_interval: 1s
    voltage_factor: 0.0001002004
    current_a_factor: 0.0000075188 # 1 / (1000 * 133)
    current_b_factor: 0.0000285714
    power_a_factor: 0.0000246870
    power_b_factor: 0.0000938105
    current_a:
      id: current1
      internal: true
      filters:
        - lambda: "return id(outlet1).state ? x : 0.0f;"
    current_b:
      id: current2
      internal: true
      filters:
        - lambda: "return id(outlet2).state ? x : 0.0f;"
    power_a:
      id: power1
      internal: true
      filters:
        - lambda: "return id(outlet1).state ? x : 0.0f;"
    power_b:
      id: power2
      internal: true
      filters:
        - lambda: "return id(outlet2).state ? x : 0.0f;"

  # ---- display sensors ----
  # The measuring sensors above are internal and publish every second: the
  # energy counters need that resolution. These template sensors are what
  # Home Assistant sees, on a 15 s raster.
  #
  # They deliberately carry NO filters. A drosselling filter would swallow
  # the immediate pushes the switches below perform at their edges, and
  # heartbeat in particular would then re-publish its own stale value on the
  # next tick and undo the push. Keeping the raster in update_interval
  # instead leaves sensor.template.publish free to take effect at once.
  - platform: template
    name: "Outlet 1 Power"
    id: power1_display
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float v = id(power1).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 1 Current"
    id: current1_display
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      const float v = id(current1).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 2 Power"
    id: power2_display
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float v = id(power2).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 2 Current"
    id: current2_display
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      const float v = id(current2).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 3 Power"
    id: power3_display
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float v = id(power3).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 3 Current"
    id: current3_display
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      const float v = id(current3).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 4 Power"
    id: power4_display
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float v = id(power4).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 4 Current"
    id: current4_display
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      const float v = id(current4).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 5 Power"
    id: power5_display
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float v = id(power5).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 5 Current"
    id: current5_display
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      const float v = id(current5).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 6 Power"
    id: power6_display
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float v = id(power6).state;
      if (std::isnan(v))
        return {};
      return v;
  - platform: template
    name: "Outlet 6 Current"
    id: current6_display
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      const float v = id(current6).state;
      if (std::isnan(v))
        return {};
      return v;

  # ---- totals ----
  - platform: template
    name: "Total Power"
    id: total_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float sum = 0.0f;
      for (auto *s : {id(power1), id(power2), id(power3),
                      id(power4), id(power5), id(power6)}) {
        if (!std::isnan(s->state))
          sum += s->state;
      }
      return sum;

  - platform: template
    name: "Total Current"
    id: total_current
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      float sum = 0.0f;
      for (auto *s : {id(current1), id(current2), id(current3),
                      id(current4), id(current5), id(current6)}) {
        if (!std::isnan(s->state))
          sum += s->state;
      }
      return sum;

  # ---- energy per outlet ----
  # The hardware energy counter is unusable here: each chip can accumulate only
  # one of its two channels, so energy is integrated in software.
  - platform: total_daily_energy
    name: "Outlet 1 Energy"
    power_id: power1
    method: trapezoid
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: 15s
  - platform: total_daily_energy
    name: "Outlet 2 Energy"
    power_id: power2
    method: trapezoid
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: 15s
  - platform: total_daily_energy
    name: "Outlet 3 Energy"
    power_id: power3
    method: trapezoid
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: 15s
  - platform: total_daily_energy
    name: "Outlet 4 Energy"
    power_id: power4
    method: trapezoid
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: 15s
  - platform: total_daily_energy
    name: "Outlet 5 Energy"
    power_id: power5
    method: trapezoid
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: 15s
  - platform: total_daily_energy
    name: "Outlet 6 Energy"
    power_id: power6
    method: trapezoid
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - throttle: 15s

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

# ======================= OVERCURRENT PROTECTION ===================
# The strip is rated 16 A. The chip's RMS registers are already averaged, so
# inrush currents do not trip this.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              // get_raw_state() bypasses the filter chain and returns the value
              // from the last poll, so this still reacts every 1 s.
              float sum = 0.0f;
              for (auto *s : {id(current1), id(current2), id(current3),
                              id(current4), id(current5), id(current6)}) {
                const float value = s->get_raw_state();
                if (!std::isnan(value))
                  sum += value;
              }
              return sum > 16.0f;
          then:
            - logger.log:
                level: ERROR
                format: "Overcurrent: %.2f A - switching all outlets off!"
                args:
                  [
                    "id(current1).get_raw_state() + id(current2).get_raw_state() + id(current3).get_raw_state() + id(current4).get_raw_state() + id(current5).get_raw_state() + id(current6).get_raw_state()",
                  ]
            - switch.turn_off: outlet1
            - switch.turn_off: outlet2
            - switch.turn_off: outlet3
            - switch.turn_off: outlet4
            - switch.turn_off: outlet5
            - switch.turn_off: outlet6

button:
  - platform: restart
    name: "Restart"
