            - sensor.template.publish:
                id: power3_display
                state: !lambda "return std::isnan(id(power3).state) ? 0.0f : id(power3).state;"
            - sensor.template.publish:
                id: current3_display
                state: !lambda "return std::isnan(id(current3).state) ? 0.0f : id(current3).state;"
  - platform: gpio
    pin: P26
    name: "Outlet 4"
    id: outlet4
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      # The trigger fires after the GPIO write, so the relay is already open.
      - sensor.template.publish:
          id: power4_display
          state: 0.0
      - sensor.template.publish:
          id: current4_display
          state: 0.0
    on_turn_on:
      # Nothing useful to send yet - wait for a fresh measurement at 1 Hz.
      - delay: 1500ms
      - if:
          condition:
            switch.is_on: outlet4
          then:
            - sensor.template.publish:
                id: power4_display
                state: !lambda "return std::isnan(id(power4).state) ? 0.0f : id(power4).state;"
