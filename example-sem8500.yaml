# Voltcraft SEM8500 (Conrad 2359015) - per-unit configuration
#
# Everything structural lives in packages/sem8500.yaml: the pin map, the three
# metering chips, the display sensors, the per-outlet energy counters, the
# switching-edge pushes and the overcurrent cutoff. This file only carries what
# differs between units.
#
# Before flashing, read the warnings in packages/sem8500.yaml - in particular
# that the stock overcurrent protection is lost when reflashing, and that you
# should take a flash dump first to recover the factory calibration.

substitutions:
  device_name: sem8500
  friendly_name: SEM8500

  # Calibration of THIS unit. Coefficients vary between units - read your own
  # out of a flash dump taken before reflashing:
  #
  #   python3 tools/extract_sem8500_calibration.py flash_dump.bin --yaml
  #
  # Leaving these out is not an error: the package ships the values of one
  # reference unit as defaults. It does mean your readings inherit another
  # unit's calibration, so expect a few percent of error.
  cs9_voltage_factor: "0.0001002004"
  cs9_current_a_factor: "0.0000075758"
  cs9_current_b_factor: "0.0000285714"
  cs9_power_a_factor: "0.0000248740"
  cs9_power_b_factor: "0.0000938105"

  cs15_voltage_factor: "0.0001001001"
  cs15_current_a_factor: "0.0000075758"
  cs15_current_b_factor: "0.0000285714"
  cs15_power_a_factor: "0.0000248491"
  cs15_power_b_factor: "0.0000937166"

  cs20_voltage_factor: "0.0001002004"
  cs20_current_a_factor: "0.0000075188"
  cs20_current_b_factor: "0.0000285714"
  cs20_power_a_factor: "0.0000246870"
  cs20_power_b_factor: "0.0000938105"

  # Check this against the circuit the strip is plugged into, not just against
  # the strip's own 16 A rating.
  max_current: "16.0"

packages:
  remote_package:
    url: https://github.com/sl1288/esphome-rn8209d
    ref: main
    files: [packages/sem8500.yaml]
    refresh: 1d

# Network and credentials stay here: they are per-unit, and !secret resolves
# against your own secrets.yaml.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SEM8500 Fallback"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Not provided by the package, so you can leave either out. The web server is
# worth keeping: it is the rescue path for OTA should the API become
# unreachable, and this device is not easy to open again for serial flashing.
captive_portal:

web_server:
