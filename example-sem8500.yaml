  - platform: gpio
    pin: P8
    name: "Outlet 5"
    id: outlet5
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      # The trigger fires after the GPIO write, so the relay is already open.
      - sensor.template.publish:
