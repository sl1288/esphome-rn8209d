# Voltcraft SEM8500 (Conrad 2359015)
# Six-outlet energy metering power strip, converted to ESPHome.
#
# ======================= SAMPLING AND ENERGY ======================
# The measuring path and the display path are deliberately separate.
#
# Measuring path: the power sensors are internal and publish every second. The
# total_daily_energy counters integrate that stream with method "trapezoid",
# the symmetric choice for instantaneous samples - it halves the error at a
# load edge instead of charging a whole interval at the new value, as the
# default method "right" would. A throttle on the counters keeps Home Assistant
# at 15 s, which is lossless because the accumulator is updated before the
# filter chain runs.
#
# Display path: a template sensor per value with update_interval: 15s and no
# filters. The switches additionally push at both edges - 0 on turn-off, and the
# first fresh measurement about 1.5 s after turn-on - so a switched outlet
# updates in Home Assistant at once instead of after up to 15 s.
#
# The raster deliberately lives in update_interval rather than in a filter,
# because sensor.template.publish runs THROUGH the filter chain: a drosselling
# filter would swallow the pushes, and heartbeat would additionally re-publish
# its own stale value on the next tick and undo them.
#
# Why not throttle_average on the power sensors? Energetically that is exact
# (mean power x elapsed time), and it was the earlier design here. But the
# averaging window runs on a fixed scheduler raster from boot, unsynchronised
# with switching, so the first value published after a change always mixes
# pre- and post-switch samples and reads too low. Dropping the zeros from that
# average is not a fix: they are what makes the energy correct.
#
# The chip's own registers refresh at 3.4 Hz (every ~294 ms) and PowerPA/PB are
# averaged rather than instantaneous, so a 1 s poll always reads fresh data.
#
# ============================ HARDWARE ============================
# Module:   Beken BK7231N (LibreTiny/bk72xx, generic-bk7231n-qfn32-tuya)
# Metering: 3x Renergy RN8209D, device ID 0x820900 each, on a software SPI bus
#
#   SCLK = P14 (SPI0_SCK)   MOSI = P16 (SPI0_MOSI)   MISO = P17 (SPI0_MISO)
#
#   Chip       Channel A          Channel B
#   ---------  -----------------  -----------------
#   CS = P9    Outlet 3 (P6)      Outlet 4 (P26)
#   CS = P15   Outlet 5 (P8)      Outlet 6 (P7)
#   CS = P20   Outlet 1 (P10)     Outlet 2 (P28)
#
# Unused: P0, P1, P11, P21, P22, P23, P24. The per-outlet indicator LEDs are
# wired to the relays and switch with them; there is no separate output.
#
# Note that P10 and P11 are UART1, the flashing and log port - the designer used
# them for relays, which is how six relays plus a three-wire SPI bus and three
# chip selects fit into 19 GPIOs at all.
#
# ========================== CALIBRATION ==========================
# The factors below come from THIS unit's stock firmware. Coefficients vary
# between units - extract your own with tools/extract_sem8500_calibration.py
# from a flash dump taken before reflashing.
#
#   voltage [V] = raw / (10 * V)
#   current [A] = raw / (1000 * I)
#   power   [W] = raw * 32768 * voltage_factor * current_factor
#
# Verified against a reference meter with a 60 W incandescent lamp:
#   reference 229 V / 60.0 W  <->  measured 227.5 V / 59.5 W, under 1 % off,
#   matching the manufacturer's spec of <+-1 % above 10 W.
#
# No current offsets - see the README for why subtracting the noise floor makes
# the readings worse rather than better.
#
# =========================== SAFETY ===========================
# The stock overcurrent protection (16.8 A +-2 %) lived in the Tuya firmware and
# is lost by reflashing. Rebuilt at the bottom of this file: above 16 A total,
# all outlets switch off. It reads get_raw_state(), which bypasses the
# filter chain, so it keeps reacting on the 1 s poll rather than
# the 15 s at which the sensors report to Home Assistant. Do not run this
# device without an equivalent safeguard, and check the threshold against
# the circuit it is plugged into.

esphome:
  name: sem8500
  friendly_name: SEM8500

bk72xx:
  board: generic-bk7231n-qfn32-tuya

external_components:
  - source: github://sl1288/esphome-rn8209d
    components: [rn8209d]

logger:
  # P0/P1 would be the log UART but belong to the hardware. Logs go over Wi-Fi.
  baud_rate: 0

# Generate your own key with `esphome config` or the ESPHome dashboard.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SEM8500 Fallback"
    password: !secret ap_password

captive_portal:

# Keep the web server: it is the rescue path for OTA should the API become
# unreachable, and this device is not easy to open again.
web_server:

# The energy counters call save() on every publish, but that only queues the
# value in RAM. sync() writes to flash on this interval and skips values that
# have not changed - with all sockets off the relay gate holds power at 0, so
# nothing changes and nothing is written at all. Raising the interval from the
# default 60 s to 300 s cuts the wear in the loaded case fivefold; the cost is
# up to five minutes of counter state on an unclean power loss. For a board
# sealed inside a mains power strip that trade is worth making.
preferences:
  flash_write_interval: 300s

time:
  - platform: sntp
    id: sntp_time

rn8209d:
  id: meter_bus
  clk_pin: P14
  mosi_pin: P16
  miso_pin: P17

# ============================ OUTLETS =============================
switch:
  - platform: gpio
    pin: P10
    name: "Outlet 1"
    id: outlet1
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      # The trigger fires after the GPIO write, so the relay is already open.
      - sensor.template.publish:
          id: power1_display
          state: 0.0
      - sensor.template.publish:
          id: current1_display
          state: 0.0
    on_turn_on:
      # Nothing useful to send yet - wait for a fresh measurement at 1 Hz.
      - delay: 1500ms
      - if:
          condition:
            switch.is_on: outlet1
          then:
            - sensor.template.publish:
                id: power1_display
                state: !lambda "return std::isnan(id(power1).state) ? 0.0f : id(power1).state;"
            - sensor.template.publish:
                id: current1_display
                state: !lambda "return std::isnan(id(current1).state) ? 0.0f : id(current1).state;"
  - platform: gpio
    pin: P28
    name: "Outlet 2"
    id: outlet2
    restore_mode: RESTORE_DEFAULT_OFF
